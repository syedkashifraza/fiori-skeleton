# Default config: UI5 from the CDN, OData requests go to a real backend.
# There is no backend yet (CAP arrives in Phase 4). Use `npm start`, which runs ui5-mock.yaml.
specVersion: "4.0"
metadata:
  name: com.team.leavetracker
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
          version: "1.148.13"
        # Phase 4: proxy the CAP service, e.g.
        # backend:
        #   - path: /odata/v4/leave
        #     url: http://localhost:4004
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        flp:
          theme: sap_horizon
